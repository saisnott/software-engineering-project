{% extends '_base.html' %}

{% block page_title %}Reset Password — MyBookstore{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
  :root {
    --ink:      #13111a;
    --surface:  #1c1928;
    --surface2: #241f35;
    --accent:   #c0392b;
    --accent2:  #e8a838;
    --muted:    #6e6a80;
    --border:   rgba(255,255,255,.07);
    --text:     #ede9f8;
    --text-dim: #9d99b0;
  }

  .auth-card {
    max-width: 460px;
    margin: 40px auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,.35);
    animation: slideUp .4s cubic-bezier(.16,1,.3,1) both;
    direction: ltr; /* تراز چپ به راست برای زبان انگلیسی */
  }

  @keyframes slideUp {
    from { opacity:0; transform:translateY(24px); }
    to   { opacity:1; transform:translateY(0); }
  }

  .card-head {
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    padding: 28px 32px;
    position: relative;
  }

  /* خط عمودی گرادینت در سمت چپ هدر */
  .card-head::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: linear-gradient(180deg, var(--accent), var(--accent2));
    border-radius: 12px 0 0 12px;
  }

  .card-head .icon-wrap {
    width: 48px; height: 48px;
    background: rgba(192,57,43,.15);
    border: 1px solid rgba(192,57,43,.3);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    color: var(--accent2);
    margin-bottom: 14px;
  }

  .card-head h1 {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    color: var(--text);
    margin: 0 0 6px;
    text-align: left;
  }

  .card-head p {
    font-size: 13px;
    color: var(--text-dim);
    margin: 0;
    line-height: 1.55;
    text-align: left;
  }

  .card-body { padding: 28px 32px 32px; }

  .card-body label {
    display: block;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 7px;
    text-align: left;
  }

  .card-body input[type="email"] {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: var(--surface2);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    box-sizing: border-box;
    transition: border-color .2s, box-shadow .2s;
    margin-bottom: 20px;
    outline: none;
  }

  .card-body input[type="email"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(192,57,43,.15);
  }

  .btn-submit {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, var(--accent), #a93226);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity .2s, transform .15s, box-shadow .15s;
    box-shadow: 0 4px 16px rgba(192,57,43,.25);
  }

  .btn-submit:hover {
    opacity: .92;
    transform: translateY(-1px);
    box-shadow: 0 6px 22px rgba(192,57,43,.35);
  }

  .back-link {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 18px;
    font-size: 13px;
    color: var(--muted);
    text-decoration: none;
    transition: color .2s;
  }
  .back-link:hover { color: var(--accent2); text-decoration: none; }
</style>

<div class="auth-card">
  <div class="card-head">
    <div class="icon-wrap"><i class="bi bi-key-fill"></i></div>
    <h1>Forgot Password</h1>
    <p>Enter your account email below. We will send you a secure link to reset your password.</p>
  </div>

  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <label for="id_email">Email Address</label>
      <input type="email" name="email" id="id_email"
             placeholder="example@email.com" required autofocus>

      <button type="submit" class="btn-submit">
        <i class="bi bi-send-fill"></i>
        Send Reset Link
      </button>
    </form>

    <a href="{% url 'login' %}" class="back-link">
      <i class="bi bi-arrow-left"></i>
      Back to Login
    </a>
  </div>
</div>

{% endblock %}
