{% extends '_base.html' %}

{% block page_title %}
Change Password
{% endblock %}

{% block content %}

<div class="form-container">
    <h1>Changee Password</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Change</button>
    </form>
</div>

<style>
.form-container {
    max-width: 400px;
    margin: 60px auto;
    padding: 25px;
    background-color: #1e1e2f;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    color: #fff;
    font-family: sans-serif;
    text-align: center;
}

h1 {
    color: #4FC3F7;
    margin-bottom: 20px;
}

form p {
    margin-bottom: 15px;
    text-align: left;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 5px;
    color: #ccc;
}

input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 6px;
    border: 1px solid #555;
    background: #2a2a3b;
    color: #fff;
    font-size: 14px;
    margin-bottom: 12px;
    box-sizing: border-box;
}

input:focus {
    outline: none;
    border-color: #4FC3F7;
}

button {
    width: 100%;
    padding: 12px;
    background-color: #2196F3;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    opacity: 0.9;
}
</style>

{% endblock %}
