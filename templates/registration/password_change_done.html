{% extends '_base.html' %}

{% block page_title %}
Password Changed
{% endblock %}

{% block content %}

<div class="confirmation-container">
    <h1>Password Changed!</h1>
    <p>Your password has been successfully updated.</p>
    <a href="{% url 'book_list' %}" class="back-btn">Go to Books List</a>
</div>

<style>
.confirmation-container {
    max-width: 450px;
    margin: 80px auto;
    padding: 30px;
    background-color: #1e1e2f;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    color: #fff;
    font-family: sans-serif;
    text-align: center;
}

h1 {
    color: #4FC3F7;
    margin-bottom: 15px;
}

p {
    color: #ccc;
    margin-bottom: 25px;
}

.back-btn {
    display: inline-block;
    padding: 12px 25px;
    background-color: #4CAF50;
    color: #fff;
    border-radius: 8px;
    text-decoration: none;
    font-size: 14px;
    transition: 0.3s;
}

.back-btn:hover {
    opacity: 0.85;
}
</style>

{% endblock %}
