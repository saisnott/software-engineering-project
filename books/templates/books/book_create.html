{% extends '_base.html' %}

{% block page_title %}Create New Book — MyBookstore{% endblock %}

{% block content %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

<style>
  :root {
    --ink:      #13111a;
    --surface:  #1c1928;
    --surface2: #241f35;
    --accent:   #c0392b;
    --accent2:  #e8a838;
    --muted:    #6e6a80;
    --border:   rgba(255,255,255,.07);
    --text:     #ede9f8;
    --text-dim: #9d99b0;
  }

  /* ── Breadcrumb ── */
  .breadcrumb-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 28px;
    direction: ltr;
  }
  .breadcrumb-bar a { color: var(--text-dim); text-decoration: none; }
  .breadcrumb-bar a:hover { color: var(--accent2); }
  .breadcrumb-bar i { font-size: 10px; }

  /* ── Card ── */
  .edit-card {
    max-width: 640px;
    margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,.35);
    animation: slideUp .4s cubic-bezier(.16,1,.3,1) both;
  }

  @keyframes slideUp {
    from { opacity:0; transform:translateY(24px); }
    to   { opacity:1; transform:translateY(0); }
  }

  /* ── Header stripe ── */
  .card-head {
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    padding: 28px 32px;
    position: relative;
    overflow: hidden;
    direction: ltr;
  }

  .card-head::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: linear-gradient(180deg, var(--accent), var(--accent2));
  }

  .card-head .eyebrow {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .card-head h1 {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    color: var(--text);
    margin: 0;
    line-height: 1.3;
  }

  .card-head h1 span { color: var(--accent2); }

  /* ── Form body ── */
  .card-body {
    padding: 30px 32px 36px;
    direction: ltr;
  }

  .card-body p { margin-bottom: 20px; }

  .card-body label {
    display: block;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 7px;
    text-align: left;
  }

  .card-body input[type="text"],
  .card-body input[type="number"],
  .card-body input[type="email"],
  .card-body input[type="url"],
  .card-body input[type="date"],
  .card-body input[type="file"],
  .card-body textarea,
  .card-body select {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid var(--border);
    border-radius: 7px;
    background: var(--surface2);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    box-sizing: border-box;
    transition: border-color .2s, box-shadow .2s;
  }

  .card-body input:focus,
  .card-body textarea:focus,
  .card-body select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(192,57,43,.18);
    background: var(--surface);
  }

  .card-body textarea { resize: vertical; min-height: 110px; }

  /* ── Divider ── */
  .form-divider {
    border: none;
    border-top: 1px dashed var(--border);
    margin: 24px 0;
  }

  /* ── Save button ── */
  .btn-save {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, var(--accent), #a93226);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background .2s, transform .15s, box-shadow .15s;
  }

  .btn-save:hover {
    opacity: 0.95;
    transform: translateY(-1px);
    box-shadow: 0 4px 14px rgba(192,57,43,.35);
  }

  /* ── Back link ── */
  .back-link {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 20px;
    font-size: 13px;
    color: var(--muted);
    text-decoration: none;
    transition: color .2s;
  }
  .back-link:hover { color: var(--accent2); text-decoration: none; }
</style>

<!-- Breadcrumb -->
<div class="breadcrumb-bar">
  <a href="{% url 'books:book_list' %}">Books</a>
  <i class="bi bi-chevron-right"></i>
  <span>Create Book</span>
</div>

<!-- Card -->
<div class="edit-card">

  <!-- Header -->
  <div class="card-head">
    <p class="eyebrow">Library Management</p>
    <h1>Add a New <span>Book</span></h1>
  </div>

  <!-- Form -->
  <div class="card-body">
    <form method="post" enctype="multipart/form-data" novalidate>
      {% csrf_token %}
      {{ form.as_p }}

      <hr class="form-divider">

      <button type="submit" class="btn-save">
        <i class="bi bi-bookmark-check-fill"></i>
        Save Book
      </button>
    </form>

    <a href="{% url 'books:book_list' %}" class="back-link">
      <i class="bi bi-arrow-left"></i>
      Back to Book List
    </a>
  </div>

</div>
{% endblock %}
